# TODO: centralize env vars (POSTGRES credentials, DATABASE_URL, AWS keys) in .env/.env.example
#       during a future operational configuration pass when all services are stable.

networks:
  traceruntime:
    external: true

services:
  localstack:
    image: localstack/localstack:3.4
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,s3
      - DEFAULT_REGION=us-east-1
      - LOCALSTACK_HOST=localstack
      - SQS_ENDPOINT_STRATEGY=off
    networks: [traceruntime]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    init: true
    mem_limit: 512m
    cpus: "0.5"
    profiles: [core, full, no-ai, infra]

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=traceruntime
      - POSTGRES_USER=traceruntime
      - POSTGRES_PASSWORD=traceruntime
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [traceruntime]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceruntime -d traceruntime"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    init: true
    mem_limit: 256m
    cpus: "0.5"
    profiles: [core, full, no-ai]

  terraform:
    image: hashicorp/terraform:1.12
    entrypoint:
      - sh
      - -c
      - "terraform init -input=false && terraform apply -auto-approve"
    working_dir: /infra
    volumes:
      - ./infra/terraform:/infra
      - terraform_cache:/terraform-cache
    environment:
      - TF_VAR_localstack_endpoint=http://localstack:4566
      - TF_PLUGIN_CACHE_DIR=/terraform-cache
    networks: [traceruntime]
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"
    mem_limit: 768m
    cpus: "1.0"
    profiles: [infra]

  migrate:
    image: migrate/migrate:v4.18.1
    command:
      - "-path=/migrations"
      - "-database=postgres://traceruntime:traceruntime@postgres:5432/traceruntime?sslmode=disable"
      - "up"
    volumes:
      - ./infra/database/migrations:/migrations:ro
    networks: [traceruntime]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 64m
    cpus: "0.25"
    profiles: [core, full, no-ai]

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - AI_RUNTIME_URL=http://ai-runtime:8000
      - QUEUE_BACKEND=sqs
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/traceruntime-tasks
      - DATABASE_URL=postgres://traceruntime:traceruntime@postgres:5432/traceruntime?sslmode=disable&pool_max_conns=5
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3001}
      - CAPACITY_RESULTS_DIR=/app/results
      - TEMPO_URL=http://tempo:3200
    volumes:
      - ./results:/app/results:ro
    networks: [traceruntime]
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: "0.5"
    profiles: [core, full, no-ai]

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/traceruntime-tasks
      - SQS_DLQ_URL=http://localstack:4566/000000000000/traceruntime-tasks-dlq
      - S3_BUCKET=traceruntime-outputs
      - API_INTERNAL_URL=http://api:8082
      - AI_RUNTIME_URL=http://ai-runtime:8000
      - AI_RUNTIME_ENABLED=true
      - DATABASE_URL=postgres://traceruntime:traceruntime@postgres:5432/traceruntime?sslmode=disable&pool_max_conns=5
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}
      - WATCHDOG_HEARTBEAT_INTERVAL_SECONDS=10
    ports:
      - "9091:9091"
    networks: [traceruntime]
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: "0.5"
    profiles: [core, full, no-ai]

  watchdog:
    build:
      context: ./services/watchdog
      dockerfile: Dockerfile
    container_name: traceruntime-watchdog
    profiles: [core, no-ai, full]
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      - DATABASE_URL=postgres://traceruntime:traceruntime@postgres:5432/traceruntime?sslmode=disable&pool_max_conns=3
      - WORKER_HEALTH_URL=http://worker:9091/health
      - API_EVENTS_URL=http://api:8082/internal/events
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/traceruntime-tasks
      - SQS_DLQ_URL=http://localstack:4566/000000000000/traceruntime-tasks-dlq
      - WATCHDOG_POLL_INTERVAL_SECONDS=15
      - WATCHDOG_HEARTBEAT_STALE_SECONDS=60
      - WATCHDOG_HEALTHCHECK_INTERVAL_SECONDS=15
      - WATCHDOG_HEALTHCHECK_FAILURES=3
      - WATCHDOG_QUEUE_LAG_THRESHOLD=50
      - WATCHDOG_TASK_STUCK_SECONDS=300
      - WATCHDOG_DLQ_DELTA_THRESHOLD=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_SERVICE_NAME=watchdog
    networks: [traceruntime]
    depends_on:
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9093/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: "0.25"

  ai-runtime:
    build:
      context: ./ai-runtime
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_HOST=http://host.docker.internal:11434
      - CHAOS_ENABLED=${CHAOS_ENABLED:-false}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-disabled}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [traceruntime]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: "1.0"
    profiles: [full]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - NEXT_PUBLIC_INTERNAL_TOKEN=${INTERNAL_TOKEN:-}
    networks: [traceruntime]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: "0.5"
    profiles: [core, full, no-ai]

volumes:
  postgres_data:
  terraform_cache:
