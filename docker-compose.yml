version: "3.9"
# TODO: centralize env vars (POSTGRES credentials, DATABASE_URL, AWS keys) in .env/.env.example
#       during a future operational configuration pass when all services are stable.

networks:
  traceruntime:
    external: true

services:
  localstack:
    image: localstack/localstack:3.4
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,s3
      - DEFAULT_REGION=us-east-1
      - LOCALSTACK_HOST=localstack
    networks: [traceruntime]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    init: true
    mem_limit: 512m
    cpus: "0.5"
    profiles: [core, full, no-ai, infra]

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=traceruntime
      - POSTGRES_USER=traceruntime
      - POSTGRES_PASSWORD=traceruntime
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [traceruntime]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceruntime -d traceruntime"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    init: true
    mem_limit: 256m
    cpus: "0.5"
    profiles: [core, full, no-ai]

  terraform:
    image: hashicorp/terraform:1.12
    entrypoint:
      - sh
      - -c
      - "terraform init -input=false && terraform apply -auto-approve"
    working_dir: /infra
    volumes:
      - ./infra/terraform:/infra
      - terraform_cache:/terraform-cache
    environment:
      - TF_VAR_localstack_endpoint=http://localstack:4566
      - TF_PLUGIN_CACHE_DIR=/terraform-cache
    networks: [traceruntime]
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m
    cpus: "0.5"
    profiles: [infra]

  migrate:
    image: migrate/migrate:v4.18.1
    command:
      - "-path=/migrations"
      - "-database=postgres://traceruntime:traceruntime@postgres:5432/traceruntime?sslmode=disable"
      - "up"
    volumes:
      - ./infra/database/migrations:/migrations:ro
    networks: [traceruntime]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 64m
    cpus: "0.25"
    profiles: [core, full, no-ai]

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - AI_RUNTIME_URL=http://ai-runtime:8000
      - QUEUE_BACKEND=sqs
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/traceruntime-tasks
      - DATABASE_URL=postgres://traceruntime:traceruntime@postgres:5432/traceruntime?sslmode=disable&pool_max_conns=5
      - INTERNAL_TOKEN=local-dev-token-change-in-prod
    networks: [traceruntime]
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    mem_limit: 256m
    cpus: "0.5"
    profiles: [core, full, no-ai]

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/traceruntime-tasks
      - SQS_DLQ_URL=http://localstack:4566/000000000000/traceruntime-tasks-dlq
      - S3_BUCKET=traceruntime-outputs
      - API_INTERNAL_URL=http://api:8082
      - AI_RUNTIME_URL=http://ai-runtime:8000
      - AI_RUNTIME_ENABLED=false
      - DATABASE_URL=postgres://traceruntime:traceruntime@postgres:5432/traceruntime?sslmode=disable&pool_max_conns=5
      - INTERNAL_TOKEN=local-dev-token-change-in-prod
    ports:
      - "9091:9091"
    networks: [traceruntime]
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    mem_limit: 128m
    cpus: "0.5"
    profiles: [core, full, no-ai]

  ai-runtime:
    build:
      context: ./ai-runtime
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [traceruntime]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    mem_limit: 768m
    cpus: "1.0"
    profiles: [full]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    networks: [traceruntime]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    init: true
    mem_limit: 256m
    cpus: "0.5"
    profiles: [core, full, no-ai]

volumes:
  postgres_data:
  terraform_cache:
