name: CI — Validation

on:
  pull_request:
    branches: [main, developer]
  push:
    branches: [main, developer]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# =============================================================================
jobs:

  # -- Go --------------------------------------------------------------------
  go:
    name: Go — build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: |
            services/api/go.sum
            services/worker/go.sum
            services/watchdog/go.sum

      # --- api ---
      - name: Build (api)
        run: go build ./...
        working-directory: services/api

      - name: Test (api)
        run: go test -race -count=1 ./...
        working-directory: services/api
        timeout-minutes: 5
        env:
          QUEUE_BACKEND: inmemory

      - name: Lint (api)
        uses: golangci/golangci-lint-action@0a35821d5c230e903fcfe077583637dea1b27b47 # v9.0.0
        with:
          version: v2.12.2
          working-directory: services/api

      # --- worker ---
      - name: Build (worker)
        run: go build ./...
        working-directory: services/worker

      - name: Test (worker)
        run: go test -race -count=1 ./...
        working-directory: services/worker
        timeout-minutes: 5

      - name: Lint (worker)
        uses: golangci/golangci-lint-action@0a35821d5c230e903fcfe077583637dea1b27b47 # v9.0.0
        with:
          version: v2.12.2
          working-directory: services/worker

      # --- watchdog ---
      - name: Build (watchdog)
        run: go build ./...
        working-directory: services/watchdog

      - name: Test (watchdog)
        run: go test -race -count=1 ./...
        working-directory: services/watchdog
        timeout-minutes: 5

      - name: Lint (watchdog)
        uses: golangci/golangci-lint-action@0a35821d5c230e903fcfe077583637dea1b27b47 # v9.0.0
        with:
          version: v2.12.2
          working-directory: services/watchdog

  # -- Frontend --------------------------------------------------------------
  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        timeout-minutes: 5

  # -- Python ----------------------------------------------------------------
  python:
    name: Python — lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-runtime/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: ai-runtime

      - name: Lint (ruff)
        run: ruff check .
        working-directory: ai-runtime

      - name: Test (pytest)
        run: pytest
        working-directory: ai-runtime

  # -- Infrastructure --------------------------------------------------------
  infrastructure:
    name: Infrastructure — Terraform + Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.12.0"

      - name: Terraform fmt check
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

      - name: Docker Compose config
        run: docker compose config --quiet

  # -- Dockerfiles -----------------------------------------------------------
  dockerfiles:
    name: Dockerfiles — Hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Lint Dockerfile (api)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: services/api/Dockerfile

      - name: Lint Dockerfile (worker)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: services/worker/Dockerfile

      - name: Lint Dockerfile (watchdog)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: services/watchdog/Dockerfile

      - name: Lint Dockerfile (ai-runtime)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ai-runtime/Dockerfile

      - name: Lint Dockerfile (frontend)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: frontend/Dockerfile
