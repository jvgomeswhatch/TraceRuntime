stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  grpc_server_max_recv_msg_size: 4194304
  grpc_server_max_send_msg_size: 4194304

# Configura o querier explicitamente para evitar auto-descobrimento via 127.0.0.1
# que causa keepalive failures em containers Docker
querier:
  frontend_worker:
    frontend_address: "127.0.0.1:9095"
    grpc_client_config:
      grpc_compression: gzip
      backoff_config:
        min_period: 100ms
        max_period: 10s
        max_retries: 10

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  max_block_duration: 5m

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 1h

query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 5s
