version: "3.9"

networks:
  traceruntime:
    external: true

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otel-collector/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector/config.yaml:/etc/otel-collector/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC — apps mandam spans aqui
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape do collector
      - "13133:13133" # Health check endpoint
    networks: [traceruntime]
    depends_on: [tempo]
    restart: unless-stopped
    mem_limit: 384m
    cpus: "0.5"

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.retention.time=2h"
      - "--storage.tsdb.retention.size=400MB"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    ports:
      - "9090:9090"
    networks: [traceruntime]
    depends_on: [otel-collector]
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"   # HTTP API + query (acesso externo ao host)
    expose:
      - "4317"        # OTLP gRPC — acessível apenas na rede interna Docker (collector → tempo)
      - "4318"        # OTLP HTTP — interno
    networks: [traceruntime]
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"

  loki:
    image: grafana/loki:3.0.0
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "3100:3100"
    networks: [traceruntime]
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_DEFAULT_THEME=dark
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks: [traceruntime]
    depends_on: [prometheus, tempo, loki]
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
