apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # tracesToLogsV2 desabilitado nesta fase: Loki não ingere logs ainda.
      # Habilitar na Phase 5 quando logs estiverem disponíveis no Loki.
      # tracesToLogsV2:
      #   datasourceUid: loki
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    # Placeholder-only nesta fase: sem ingestão, sem Promtail.
    # Datasource configurado para Phase 5. Não habilitar tracesToLogs no Tempo enquanto não houver dados.
